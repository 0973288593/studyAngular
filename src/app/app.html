<div class="card" [class.dark]="darkMode">
  <h1>สวัสดีครับ ผมชื่อ {{ name }}</h1>

  <p [style.display]="showDetail ? 'block' : 'none'">
    อาชีพ: {{ job }}
  </p>

  <input #nameBox [value]="name" (input)="name = nameBox.value" />

  <div class="actions">
    <button (click)="toggleTheme()">
      {{ darkMode ? '☀️ โหมดสว่าง' : '🌙 โหมดมืด' }}
    </button>
    <button (click)="toggleDetail()">
      {{ showDetail ? 'ซ่อน' : 'แสดง' }}รายละเอียด
    </button>
  </div>
  <div>
    <button (click)="btnaddNumber()">
      +
    </button>
    <span [style.color]="(num > 10) ? 'red' : '' ">
      {{num}}
    </span>
    <button (click)="btnRemoveNumber()">
      -
    </button>

    <span (click)="btnReset()">
      reset
    </span>

  </div>
  <div>
    <input #box (keyup.enter)="message = box.value" />
    <p>คุณพิมพ์ว่า: {{ message }}</p>
  </div>
  <app-stopwatch />

  <app-like-button />

  <app-coffee-order/>


  <app-grade-calc/>
  <app-todo-list/>
</div>
